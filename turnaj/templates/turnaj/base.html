<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Turnajový Systém</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #f8f9fa; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; display: flex; flex-direction: column; min-height: 100vh; }
        .navbar-custom { background-color: #ffffff; border-bottom: 1px solid #dee2e6; }
        .main-card { border: none; border-radius: 0.75rem; background-color: #ffffff; }
        .table-custom th { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: #6c757d; }
        .table-custom td { vertical-align: middle; padding: 1rem 0.75rem; }
        .score-display { font-weight: 700; font-size: 1.1rem; color: #212529; min-width: 70px; display: inline-block; text-align: center; }
        .status-badge { font-size: 0.75rem; font-weight: 600; padding: 0.35rem 0.6rem; border-radius: 0.5rem; }
        .badge-completed { background-color: #e2f0d9; color: #385723; }
        .badge-upcoming { background-color: #fff2cc; color: #7f6000; }
        .hero-card { border: none; border-radius: 1rem; background: white; padding: 4rem 2rem; text-align: center; margin-top: 3rem; }
        footer { margin-top: auto; background-color: #ffffff; border-top: 1px solid #dee2e6; color: #6c757d; }
    </style>
</head>
<body>

    <nav class="navbar navbar-expand-lg navbar-custom py-3 mb-4 shadow-sm">
        <div class="container">
            <a class="navbar-brand fw-bold text-dark" href="{% url 'index' %}">Turnajový Systém</a>
            <div class="navbar-nav ms-auto">
                <a class="nav-link small me-2 {% if request.resolver_match.url_name == 'index' %}active fw-semibold text-primary{% endif %}" href="{% url 'index' %}">Domů</a>
                <a class="nav-link small me-2 {% if request.resolver_match.url_name == 'seznam_tymu' %}active fw-semibold text-primary{% endif %}" href="{% url 'seznam_tymu' %}">Týmy</a>
                <a class="nav-link small {% if request.resolver_match.url_name == 'seznam_zapasu' %}active fw-semibold text-primary{% endif %}" href="{% url 'seznam_zapasu' %}">Zápasy</a>
            </div>
        </div>
    </nav>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

    <footer class="py-4 mt-5 shadow-sm text-center">
        <div class="container">
            <span class="small fw-medium">Vytvořil: <strong>Matyáš Fiala</strong> &copy; 2026</span>
        </div>
    </footer>

</body>
</html>
